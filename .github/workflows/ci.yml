name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aies_ci?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/aies_ci?schema=public"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Apply committed migrations to a fresh database
        run: npx prisma migrate deploy

      # Tests run against the now-migrated CI database — several exercise real Prisma
      # queries/raw SQL (e.g. src/server/core/rate-limit.ts's atomic upsert) rather than mocking.
      - run: npm test

      - name: Fail if the Prisma schema has drifted from committed migrations
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema \
            --exit-code

      - run: npm run build

  # specs/00-foundation.md §9.2: the self-host fallback is "kept working but not the deployment
  # path. A test in CI must prove it still boots, or it will rot within two months." This builds
  # the image and brings the stack up far enough to prove the app answers through Caddy.
  self-host-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the compose stack
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret-not-used-anywhere-real
          # Caddy would try to obtain a real certificate for a public domain; localhost makes it
          # serve over plain HTTP so CI does not depend on Let's Encrypt being reachable.
          APP_DOMAIN: localhost
        run: docker compose -f docker/docker-compose.yml up -d --build --wait --wait-timeout 300

      - name: The app must answer through Caddy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then
              echo "self-host stack is serving"
              exit 0
            fi
            sleep 5
          done
          echo "::error::self-host fallback did not serve /api/health within 150s"
          docker compose -f docker/docker-compose.yml logs --tail 100
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # Runs Prisma's real migration path against the production database. Inert until the Supabase
  # project exists and DATABASE_URL/DIRECT_URL secrets are set (module 00 session 5,
  # docs/DEPLOYMENT.md) — Spec.md §9.1: "migrations never run by hand against production."
  deploy-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
