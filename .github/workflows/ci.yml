name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aies_ci?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/aies_ci?schema=public"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Apply committed migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Fail if the Prisma schema has drifted from committed migrations
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema \
            --exit-code

      - run: npm run build

  # Runs Prisma's real migration path against the production database. Inert until the Supabase
  # project exists and DATABASE_URL/DIRECT_URL secrets are set (module 00 session 5,
  # docs/DEPLOYMENT.md) — Spec.md §9.1: "migrations never run by hand against production."
  deploy-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
