# Local development database only — not a deployment target (Spec.md §3.1, §7.1).
# Usage: docker compose -f docker/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aies
    ports:
      - "5432:5432"
    volumes:
      - aies_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aies_dev_postgres:
